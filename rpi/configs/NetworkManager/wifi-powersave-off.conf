# Disable WiFi power-save on wlan0.
#
# The Pi's Broadcom/Cypress WiFi enters power-save by default, which drops
# multicast packets (mDNS / here.local discovery) and makes the station
# association flaky right after boot. 2 = disable. NetworkManager applies
# this on every connection activation, so it survives reboots and reconnects.
[connection]
wifi.powersave = 2
